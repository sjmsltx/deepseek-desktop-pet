# 3.0 unified pytest collection policy (2026-09-21)
#  (1) manual regression runner (regression_test.py) is excluded in conftest.py
#  (2) collect only tests/ : avoid recursing into assets_3.0/ and release_build/
#      (the latter contains a full copy of the project)
[pytest]
testpaths = tests
norecursedirs = assets assets_3.0 prototype release_build backup .git __pycache__ logs

# S1-B（Owner 2026-09-26 批）：只把**这一类**警告升级为错误 ✓
# ⚠️ 绝不一刀切把全部 warning 变 error ✗（-W default 下另有数百条 ResourceWarning，会立刻全炸 ✗）
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
