# 3.0 unified pytest collection policy (2026-09-21)
#  (1) regression_test.py is a manual regression runner script (def test(name, fn)
#      needs an external name) -> do not collect it, otherwise the whole-suite exit
#      code becomes 1 even when every case is green (CI would falsely fail).
#  (2) Collect only tests/ : avoid recursing into assets_3.0/ and release_build/
#      (the latter contains a full copy of the project).
[pytest]
testpaths = tests
collect_ignore = regression_test.py
norecursedirs = assets assets_3.0 prototype release_build backup .git __pycache__ logs
